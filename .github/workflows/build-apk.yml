name: Build TaliKhata APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish TaliKhata APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for easy install
        run: cp app/build/outputs/apk/debug/app-debug.apk TaliKhata-JEOBAYER.apk

      - name: Upload APK Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: TaliKhata-JEOBAYER-APK
          path: TaliKhata-JEOBAYER.apk

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk TaliKhata-JEOBAYER.apk \
            --title "TaliKhata (JEOBAYER) APK" \
            --notes "সরাসরি ফোনে ইনস্টল করার জন্য TaliKhata-JEOBAYER.apk ডাউনলোড করুন।" \
            --latest
